<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RailAssembly &mdash; Electric Rolling Stock OEM Management</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>
  <div id="app" class="app-container">
    <header class="app-header">
      <div class="brand-section">
        <div>
          <h1 class="brand-title">RailAssembly</h1>
          <span class="brand-subtitle">Electric Traction &bull; Enterprise Operations</span>
        </div>
      </div>

      <div class="metrics-bar" id="top-metrics">
        <div class="metric-chip">
          <span class="metric-label">Capital Reserve</span>
          <span class="metric-value" id="val-funds">$14,500,000</span>
        </div>

        <div class="metric-chip">
          <span class="metric-label">Quarterly Profit (Est)</span>
          <span class="metric-value text-positive" id="val-profit">+$1,450,000</span>
        </div>

        <div class="metric-chip">
          <span class="metric-label">Board Standing</span>
          <span class="metric-value text-blue" id="val-rep">72%</span>
        </div>

        <div class="metric-chip">
          <span class="metric-label">Active Warehouse</span>
          <span class="metric-value" id="val-wh">24 / 200</span>
        </div>

        <div class="metric-chip calendar-chip">
          <span class="metric-label" id="val-date">October 26, Year 1</span>
          <span class="metric-sub" id="val-quarter">Quarter 4 Year 1</span>
        </div>
      </div>

      <div class="time-controls">
        <button class="c-btn btn-ghost btn-sm" id="btn-pause" title="Pause">II</button>
        <button class="c-btn btn-primary btn-sm" id="btn-play-1" title="1x Speed">1x</button>
        <button class="c-btn btn-ghost btn-sm" id="btn-play-2" title="3x Speed">3x</button>
      </div>
    </header>

    <div class="main-body">
      <nav class="side-navigation" id="main-nav">
        <div class="nav-section-title">Navigation</div>
        <button class="nav-tab active" data-tab="dashboard">
          <span class="nav-label">Executive Overview</span>
        </button>
        <button class="nav-tab" data-tab="builder">
          <span class="nav-label">Engineering CAD</span>
        </button>
        <button class="nav-tab" data-tab="catalog">
          <span class="nav-label">Fleet Catalog</span>
        </button>
        <button class="nav-tab" data-tab="inventory">
          <span class="nav-label">Supply &amp; Inventory</span>
        </button>
        <button class="nav-tab" data-tab="research">
          <span class="nav-label">R&amp;D Directorate</span>
        </button>
        <button class="nav-tab" data-tab="market">
          <span class="nav-label">Ministry Tenders</span>
        </button>
      </nav>

      <main class="content-viewport" id="viewport-root">
        <!-- Modular dashboard views rendered here -->
      </main>
    </div>

    <div id="modal-container" class="modal-layer hidden">
      <div class="modal-backdrop" id="modal-backdrop"></div>
      <div class="modal-frame" id="modal-content"></div>
    </div>

    <div id="toast-shelf" class="toast-shelf"></div>
  </div>

  <script src="js/data/componentsdata.js"></script>
  <script src="js/data/subcomponentsdata.js"></script>
  <script src="js/data/techdata.js"></script>
  <script src="js/data/marketdata.js"></script>
  <script src="js/models/gamestate.js"></script>
  <script src="js/models/trainmodel.js"></script>
  <script src="js/models/ordercalc.js"></script>
  <script src="js/ui/icons.js"></script>
  <script src="js/ui/uicomponents.js"></script>
  <script src="js/ui/dashboardview.js"></script>
  <script src="js/ui/builderview.js"></script>
  <script src="js/ui/catalogview.js"></script>
  <script src="js/ui/inventoryview.js"></script>
  <script src="js/ui/researchview.js"></script>
  <script src="js/ui/marketview.js"></script>
  <script src="js/events.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
